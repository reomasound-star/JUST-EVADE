<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,
               initial-scale=1,
               viewport-fit=cover,
               user-scalable=no">

<title>JUST EVADE</title>

<style>

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#020711;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Helvetica Neue",
    Arial,
    sans-serif;
}

body{
  touch-action:manipulation;
  color:#eaffff;
}

button{
  border:0;
  outline:0;
  font:inherit;
  color:inherit;
}

#app{
  position:relative;
  width:100vw;
  height:100dvh;
  max-width:540px;
  margin:auto;
  overflow:hidden;

  background:
    linear-gradient(
      145deg,
      #07182c 0%,
      #030914 46%,
      #0b0619 100%
    );
}


/* =========================
   BACKGROUND
========================= */

.grid-bg{
  position:absolute;
  inset:0;

  background:
    linear-gradient(
      rgba(50,180,255,.055) 1px,
      transparent 1px
    ),
    linear-gradient(
      90deg,
      rgba(50,180,255,.055) 1px,
      transparent 1px
    );

  background-size:32px 32px;

  opacity:.65;
}

.grid-bg::after{
  content:"";
  position:absolute;
  inset:0;

  background:
    linear-gradient(
      125deg,
      transparent 0%,
      transparent 48%,
      rgba(0,220,255,.08) 48.2%,
      transparent 48.8%
    ),
    linear-gradient(
      72deg,
      transparent 0%,
      transparent 62%,
      rgba(255,0,200,.06) 62.2%,
      transparent 63%
    );
}


/* =========================
   MOON
========================= */

.moon{
  position:absolute;

  width:170px;
  height:170px;

  right:-25px;
  top:82px;

  border-radius:50%;

  background:
    radial-gradient(
      circle at 32% 28%,
      #e9fbff 0%,
      #a5eaff 28%,
      #56b8ed 55%,
      #245795 78%,
      #142e61 100%
    );

  box-shadow:
    0 0 20px rgba(95,230,255,.75),
    0 0 70px rgba(65,180,255,.35);
}

.moon::after{
  content:"";

  position:absolute;

  width:30px;
  height:30px;

  left:42px;
  top:37px;

  border-radius:50%;

  background:rgba(20,70,120,.22);

  box-shadow:
    38px 32px 0 5px rgba(20,70,120,.13),
    -8px 48px 0 2px rgba(20,70,120,.15);
}


/* =========================
   CITY
========================= */

.city{
  position:absolute;
  left:0;
  right:0;
  bottom:0;

  height:48%;

  opacity:.75;

  background:
    repeating-linear-gradient(
      90deg,
      #020711 0 26px,
      #09162a 27px 48px,
      #030914 49px 74px
    );

  clip-path:polygon(
    0 30%,
    7% 20%,
    13% 34%,
    20% 12%,
    28% 30%,
    36% 17%,
    44% 35%,
    52% 11%,
    60% 29%,
    68% 16%,
    76% 33%,
    84% 10%,
    92% 28%,
    100% 17%,
    100% 100%,
    0 100%
  );
}

.city::after{
  content:"";

  position:absolute;
  inset:30% 0 0;

  background:
    repeating-linear-gradient(
      90deg,
      transparent 0 17px,
      rgba(80,230,255,.15) 18px 20px,
      transparent 21px 43px
    ),
    repeating-linear-gradient(
      0deg,
      transparent 0 23px,
      rgba(80,230,255,.08) 24px 25px
    );
}


/* =========================
   TOP
========================= */

.header{
  position:absolute;

  left:6%;
  right:6%;
  top:5%;

  z-index:5;

  display:flex;
  justify-content:space-between;
}

.logo{
  font-size:11px;
  font-weight:800;

  letter-spacing:5px;

  color:#8cecff;

  text-shadow:
    0 0 12px rgba(75,230,255,.55);
}

.system{
  margin-top:7px;

  font-size:8px;

  letter-spacing:3px;

  color:#728aa5;
}

.area{
  text-align:right;

  font-size:28px;

  font-weight:900;

  letter-spacing:2px;

  text-shadow:
    0 0 18px rgba(90,220,255,.5);
}

.area small{
  display:block;

  margin-top:7px;

  font-size:8px;

  letter-spacing:4px;

  color:#8ca5bb;

  font-weight:500;
}


/* =========================
   DIVIDER
========================= */

.divider{
  position:absolute;

  top:15%;

  left:6%;
  right:6%;

  height:1px;

  background:
    linear-gradient(
      90deg,
      #50e9ff,
      rgba(80,230,255,.2) 65%,
      transparent
    );

  box-shadow:
    0 0 8px rgba(80,230,255,.35);
}


/* =========================
   STAGE GRID
========================= */

.stage-grid{

  position:absolute;

  left:5%;
  right:5%;

  top:19%;

  bottom:15%;

  z-index:5;

  display:grid;

  grid-template-columns:
    repeat(2,1fr);

  grid-template-rows:
    repeat(5,1fr);

  gap:9px;
}


/* =========================
   STAGE CARD
========================= */

.stage{

  position:relative;

  overflow:hidden;

  text-align:left;

  padding:14px 13px;

  background:
    linear-gradient(
      135deg,
      rgba(5,25,47,.92),
      rgba(10,5,30,.84)
    );

  border:
    1px solid rgba(72,220,255,.38);

  clip-path:
    polygon(
      0 0,
      93% 0,
      100% 13%,
      100% 100%,
      7% 100%,
      0 87%
    );

  transition:
    transform .1s,
    filter .1s,
    box-shadow .15s;
}

.stage::before{

  content:"";

  position:absolute;

  left:0;
  top:0;

  width:40%;
  height:1px;

  background:#59eaff;

  box-shadow:
    0 0 10px #59eaff;
}

.stage::after{

  content:"";

  position:absolute;

  right:-25px;
  bottom:-30px;

  width:85px;
  height:85px;

  border-radius:50%;

  border:
    1px solid rgba(255,70,220,.16);
}

.stage:active{

  transform:scale(.96);

  filter:
    brightness(1.5);

}


/* =========================
   SELECTED
========================= */

.stage.selected{

  border-color:#ff55df;

  box-shadow:
    inset 0 0 35px rgba(255,55,220,.12),
    0 0 18px rgba(255,55,220,.15);
}

.stage.selected::before{

  background:#ff61df;

  box-shadow:
    0 0 13px #ff61df;
}


/* =========================
   TEXT
========================= */

.stage-number{

  font-size:8px;

  letter-spacing:2.5px;

  color:#70ddff;
}

.stage-name{

  position:absolute;

  left:13px;
  bottom:23px;

  font-size:9px;

  letter-spacing:1.8px;

  white-space:nowrap;

  color:#ddf9ff;
}

.rank{

  position:absolute;

  right:11px;
  top:6px;

  font-size:27px;

  font-weight:900;

  font-style:italic;

  color:#f4fcff;

  text-shadow:
    0 0 15px rgba(80,225,255,.65);
}

.stage.selected .rank{

  color:#ff91eb;

  text-shadow:
    0 0 17px rgba(255,75,220,.9);
}

.score{

  position:absolute;

  right:11px;
  bottom:8px;

  font-size:7px;

  letter-spacing:1px;

  color:#70879e;
}

.line{

  position:absolute;

  left:13px;
  right:13px;

  bottom:7px;

  height:1px;

  background:rgba(130,170,190,.15);
}

.line span{

  display:block;

  height:100%;

  background:
    linear-gradient(
      90deg,
      #53e9ff,
      #d3fbff
    );

  box-shadow:
    0 0 8px #53e9ff;
}


/* =========================
   BOTTOM
========================= */

.bottom{

  position:absolute;

  left:5%;
  right:5%;

  bottom:3%;

  z-index:6;

  display:flex;

  align-items:center;

  justify-content:space-between;
}

.area-button{

  padding:10px 14px;

  background:
    rgba(3,15,29,.88);

  border:
    1px solid rgba(80,225,255,.42);

  font-size:8px;

  letter-spacing:2px;

  color:#d7f8ff;
}

.area-button:active{

  transform:scale(.94);

  filter:brightness(1.5);
}

.page{

  font-size:8px;

  letter-spacing:4px;

  color:#7189a1;
}


/* =========================
   DETAIL
========================= */

.detail{

  position:absolute;

  inset:0;

  z-index:20;

  display:none;

  align-items:flex-end;

  background:
    rgba(1,5,14,.72);

  backdrop-filter:blur(11px);

  -webkit-backdrop-filter:blur(11px);
}

.detail.show{
  display:flex;
}

.detail-panel{

  width:100%;

  padding:
    38px 8% 9%;

  border-top:
    1px solid #55e8ff;

  background:
    linear-gradient(
      180deg,
      transparent 0%,
      rgba(3,7,17,.97) 18%
    );

  box-shadow:
    0 -10px 50px rgba(30,180,255,.08);
}

.close{

  position:absolute;

  right:6%;
  top:12px;

  padding:10px;

  background:none;

  font-size:9px;

  letter-spacing:2px;

  color:#8ba3b8;
}

.kicker{

  font-size:8px;

  letter-spacing:3px;

  color:#63eaff;
}

.detail-title{

  margin:5px 0 3px;

  font-size:40px;

  font-style:italic;

  letter-spacing:3px;

  text-shadow:
    0 0 20px rgba(70,220,255,.3);
}

.detail-name{

  margin:0 0 22px;

  font-size:9px;

  letter-spacing:3px;

  color:#8199b0;
}

.stats{

  display:flex;

  gap:30px;

  margin-bottom:24px;
}

.stat-label{

  font-size:7px;

  letter-spacing:1.5px;

  color:#718aa1;
}

.stat-value{

  margin-top:4px;

  font-size:20px;

  font-weight:800;
}

.start{

  width:100%;

  padding:16px;

  border:
    1px solid #ff58df;

  background:
    linear-gradient(
      90deg,
      rgba(255,52,218,.22),
      rgba(53,216,255,.13)
    );

  font-size:10px;

  font-weight:900;

  letter-spacing:4px;

  text-shadow:
    0 0 10px rgba(255,100,230,.4);
}

.start:active{

  transform:scale(.98);

  filter:brightness(1.35);
}


/* =========================
   TOAST
========================= */

.toast{

  position:absolute;

  left:50%;
  bottom:16%;

  z-index:30;

  transform:
    translateX(-50%);

  padding:10px 16px;

  border:
    1px solid rgba(80,225,255,.45);

  background:
    rgba(2,12,24,.95);

  font-size:8px;

  letter-spacing:2px;

  white-space:nowrap;

  opacity:0;

  pointer-events:none;

  transition:opacity .15s;
}

.toast.show{
  opacity:1;
}

</style>
</head>


<body>

<div id="app">

  <div class="grid-bg"></div>

  <div class="moon"></div>

  <div class="city"></div>


  <!-- HEADER -->

  <header class="header">

    <div>

      <div class="logo">
        JUST EVADE
      </div>

      <div class="system">
        STAGE SELECT SYSTEM
      </div>

    </div>

    <div class="area">
      AREA 01

      <small>
        NEON CITY
      </small>

    </div>

  </header>


  <div class="divider"></div>


  <!-- STAGES -->

  <main
    class="stage-grid"
    id="stageGrid">
  </main>


  <!-- BOTTOM -->

  <footer class="bottom">

    <button
      class="area-button"
      id="prevArea">
      ◀ AREA
    </button>

    <div class="page">
      01 — 10
    </div>

    <button
      class="area-button"
      id="nextArea">
      AREA ▶
    </button>

  </footer>


  <!-- DETAIL -->

  <section
    class="detail"
    id="detail">

    <button
      class="close"
      id="close">
      CLOSE ×
    </button>

    <div class="detail-panel">

      <div class="kicker">
        SELECTED STAGE
      </div>

      <div
        class="detail-title"
        id="detailTitle">
        STAGE 01
      </div>

      <div
        class="detail-name"
        id="detailName">
        NEON RUN
      </div>


      <div class="stats">

        <div>

          <div class="stat-label">
            BEST SCORE
          </div>

          <div
            class="stat-value"
            id="detailScore">
            184520
          </div>

        </div>


        <div>

          <div class="stat-label">
            RANK
          </div>

          <div
            class="stat-value"
            id="detailRank">
            S
          </div>

        </div>


        <div>

          <div class="stat-label">
            COMBO
          </div>

          <div
            class="stat-value"
            id="detailCombo">
            84
          </div>

        </div>

      </div>


      <button
        class="start"
        id="startStage">
        START STAGE
      </button>

    </div>

  </section>


  <div
    class="toast"
    id="toast">
  </div>

</div>


<script>

const stages = [

  {
    name:"NEON RUN",
    rank:"S",
    score:"184520"
  },

  {
    name:"BLUE MOON",
    rank:"A",
    score:"160340"
  },

  {
    name:"NIGHT GRID",
    rank:"A",
    score:"148220"
  },

  {
    name:"CYBER VEIL",
    rank:"B",
    score:"129870"
  },

  {
    name:"SKY LINE",
    rank:"S",
    score:"176400"
  },

  {
    name:"RAPID EDGE",
    rank:"A",
    score:"151220"
  },

  {
    name:"DARK FLOW",
    rank:"B",
    score:"112640"
  },

  {
    name:"ZERO POINT",
    rank:"A",
    score:"145900"
  },

  {
    name:"MOON RISE",
    rank:"S",
    score:"190120"
  },

  {
    name:"LAST GATE",
    rank:"—",
    score:"000000"
  }

];


const grid =
  document.getElementById("stageGrid");


/* =========================
   CREATE STAGES
========================= */

stages.forEach((stage,index)=>{

  const button =
    document.createElement("button");

  button.className =
    "stage" +
    (index === 0 ? " selected" : "");

  button.type = "button";


  const progress =
    stage.rank === "—"
      ? 0
      : 55 + index * 4;


  button.innerHTML = `

    <div class="stage-number">
      STAGE ${String(index+1).padStart(2,"0")}
    </div>

    <div class="rank">
      ${stage.rank}
    </div>

    <div class="stage-name">
      ${stage.name}
    </div>

    <div class="score">
      ${stage.score}
    </div>

    <div class="line">
      <span style="width:${progress}%"></span>
    </div>

  `;


  button.addEventListener(
    "click",
    ()=>selectStage(index)
  );


  grid.appendChild(button);

});


/* =========================
   STAGE SELECT
========================= */

function selectStage(index){

  document
    .querySelectorAll(".stage")
    .forEach(el=>{
      el.classList.remove("selected");
    });


  document
    .querySelectorAll(".stage")[index]
    .classList.add("selected");


  const stage =
    stages[index];


  document.getElementById(
    "detailTitle"
  ).textContent =
    `STAGE ${String(index+1).padStart(2,"0")}`;


  document.getElementById(
    "detailName"
  ).textContent =
    stage.name;


  document.getElementById(
    "detailScore"
  ).textContent =
    stage.score;


  document.getElementById(
    "detailRank"
  ).textContent =
    stage.rank;


  document.getElementById(
    "detailCombo"
  ).textContent =
    stage.rank === "—"
      ? "—"
      : 42 + index * 7;


  document
    .getElementById("detail")
    .classList.add("show");

}


/* =========================
   CLOSE
========================= */

document
  .getElementById("close")
  .addEventListener(
    "click",
    ()=>{
      document
        .getElementById("detail")
        .classList.remove("show");
    }
  );


/* =========================
   START
========================= */

document
  .getElementById("startStage")
  .addEventListener(
    "click",
    ()=>{

      showToast(
        "STAGE START — DEMO"
      );

    }
  );


/* =========================
   AREA
========================= */

document
  .getElementById("prevArea")
  .addEventListener(
    "click",
    ()=>{

      showToast(
        "AREA 10 ←"
      );

    }
  );


document
  .getElementById("nextArea")
  .addEventListener(
    "click",
    ()=>{

      showToast(
        "AREA 02 — COMING SOON"
      );

    }
  );


/* =========================
   TOAST
========================= */

function showToast(text){

  const toast =
    document.getElementById("toast");

  toast.textContent =
    text;

  toast.classList.add("show");


  setTimeout(
    ()=>{
      toast.classList.remove("show");
    },
    1300
  );

}

</script>

</body>
</html>

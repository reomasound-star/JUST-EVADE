<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#030711">
<title>JUST EVADE — AREA 01</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:#02050d;color:#e9fbff;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif}
body{overflow:hidden;touch-action:manipulation}
button{font:inherit;color:inherit;-webkit-tap-highlight-color:transparent}
#app{position:relative;width:100vw;height:100dvh;max-width:540px;margin:auto;overflow:hidden;background:#030711}
.bg{position:absolute;inset:0;background:
radial-gradient(ellipse at 72% 17%,rgba(61,193,255,.18) 0%,rgba(61,193,255,.06) 18%,transparent 38%),
linear-gradient(155deg,#07172b 0%,#030914 48%,#0b0619 100%)}
.bg:before{content:"";position:absolute;inset:0;background:
linear-gradient(112deg,transparent 0 52%,rgba(72,222,255,.07) 52.1%,transparent 52.5%),
linear-gradient(76deg,transparent 0 64%,rgba(255,55,220,.06) 64.1%,transparent 64.5%),
repeating-linear-gradient(90deg,transparent 0 9.8%,rgba(71,207,255,.055) 10%,transparent 10.15%);
opacity:.9}
.scan{position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(255,255,255,.015) 0 1px,transparent 1px 5px);mix-blend-mode:screen;pointer-events:none}
.moon{position:absolute;right:6%;top:7%;width:min(29vw,150px);aspect-ratio:1;border-radius:50%;
background:radial-gradient(circle at 34% 30%,#e8fbff 0,#9be7ff 30%,#4a9de8 58%,#1c3f80 100%);
box-shadow:0 0 22px #55dfff,0 0 65px rgba(42,150,255,.42)}
.moon:after{content:"";position:absolute;width:17%;height:17%;border-radius:50%;left:27%;top:20%;background:rgba(25,78,132,.22);box-shadow:35px 22px 0 7px rgba(25,78,132,.12),-7px 36px 0 4px rgba(25,78,132,.14)}
.city{position:absolute;left:0;right:0;bottom:0;height:44%;opacity:.85;background:
linear-gradient(165deg,transparent 0 35%,rgba(35,181,255,.10) 35.2%,transparent 36%),
repeating-linear-gradient(90deg,
rgba(4,10,22,.95) 0 7%,rgba(13,25,48,.88) 7.1% 10%,
rgba(3,9,20,.96) 10.1% 16%,rgba(17,28,48,.85) 16.1% 18%);
clip-path:polygon(0 30%,6% 20%,12% 33%,19% 13%,25% 28%,31% 18%,38% 35%,44% 10%,51% 28%,57% 16%,64% 34%,71% 8%,78% 27%,84% 17%,91% 31%,97% 12%,100% 21%,100% 100%,0 100%)}
.city:after{content:"";position:absolute;inset:30% 0 0;background:
repeating-linear-gradient(90deg,transparent 0 4%,rgba(78,225,255,.18) 4.2% 4.5%,transparent 4.7% 8%),
repeating-linear-gradient(0deg,transparent 0 15px,rgba(78,225,255,.08) 16px 17px,transparent 18px 29px)}
.top{position:absolute;z-index:3;left:5.5%;right:5.5%;top:4%;display:flex;justify-content:space-between;align-items:flex-start}
.brand{font-size:10px;letter-spacing:4px;color:#8ceeff;font-weight:700}
.sys{font-size:8px;letter-spacing:2px;color:#738da8;margin-top:6px}
.area{text-align:right;font-size:25px;line-height:1;font-weight:900;letter-spacing:2px;text-shadow:0 0 18px rgba(71,220,255,.55)}
.area small{display:block;margin-top:7px;font-size:8px;letter-spacing:3px;color:#8ea8bf;font-weight:500}
.divider{position:absolute;top:14.5%;left:5.5%;right:5.5%;height:1px;background:linear-gradient(90deg,#48e7ff,rgba(72,231,255,.15) 62%,transparent)}
.grid{position:absolute;z-index:3;left:5%;right:5%;top:19%;bottom:14%;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:repeat(5,1fr);gap:8px}
.card{position:relative;border:1px solid rgba(74,222,255,.35);background:linear-gradient(135deg,rgba(4,23,44,.88),rgba(10,5,30,.76));overflow:hidden;text-align:left;padding:12px;clip-path:polygon(0 0,93% 0,100% 13%,100% 100%,7% 100%,0 87%);box-shadow:inset 0 0 24px rgba(50,194,255,.035)}
.card:before{content:"";position:absolute;left:0;top:0;width:38%;height:1px;background:#62eaff;box-shadow:0 0 10px #62eaff}
.card:after{content:"";position:absolute;right:-28px;bottom:-30px;width:80px;height:80px;border-radius:50%;border:1px solid rgba(255,70,219,.15)}
.card:active{transform:scale(.975);filter:brightness(1.45)}
.card.selected{border-color:#ff55dc;box-shadow:inset 0 0 30px rgba(255,55,220,.10),0 0 18px rgba(255,55,220,.16)}
.card.selected:before{background:#ff62df;box-shadow:0 0 12px #ff62df}
.num{font-size:8px;letter-spacing:2.2px;color:#70ddff}
.name{position:absolute;left:12px;bottom:20px;font-size:9px;letter-spacing:1.6px;color:#d9f8ff;white-space:nowrap}
.score{position:absolute;right:11px;bottom:9px;font-size:7px;letter-spacing:1px;color:#6e879d}
.rank{position:absolute;right:10px;top:6px;font-size:25px;font-weight:900;font-style:italic;color:#f0fbff;text-shadow:0 0 13px rgba(76,223,255,.65)}
.card.selected .rank{color:#ff8be8;text-shadow:0 0 15px rgba(255,72,219,.8)}
.progress{position:absolute;left:12px;right:12px;bottom:7px;height:1px;background:rgba(130,160,180,.15)}
.progress i{display:block;height:100%;background:linear-gradient(90deg,#53e9ff,#b9f8ff);box-shadow:0 0 7px #53e9ff}
.bottom{position:absolute;z-index:4;left:5%;right:5%;bottom:3%;height:7%;display:flex;align-items:center;justify-content:space-between}
.nav{background:rgba(3,15,29,.86);border:1px solid rgba(80,224,255,.4);padding:9px 13px;font-size:8px;letter-spacing:2px}
.pages{font-size:8px;letter-spacing:3px;color:#738da6}
.detail{display:none;position:absolute;z-index:20;inset:0;background:rgba(1,5,14,.70);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);align-items:flex-end}
.panel{position:relative;width:100%;padding:32px 7% 8%;background:linear-gradient(180deg,transparent,#030711 20%);border-top:1px solid #55e8ff}
.close{position:absolute;right:6%;top:10px;border:0;background:transparent;padding:12px;color:#8ca4ba;font-size:9px;letter-spacing:2px}
.kicker{font-size:8px;letter-spacing:3px;color:#62eaff}
.panel h1{margin:5px 0 2px;font-size:40px;letter-spacing:3px;font-style:italic}
.panel p{margin:0 0 20px;font-size:9px;letter-spacing:2px;color:#7e96ad}
.stats{display:flex;gap:25px;margin-bottom:22px}
.stats span{display:block;font-size:7px;letter-spacing:1.5px;color:#728ba3}.stats b{display:block;margin-top:4px;font-size:20px}
.start{width:100%;padding:15px;border:1px solid #ff58df;background:linear-gradient(90deg,rgba(255,52,218,.20),rgba(53,216,255,.12));font-size:10px;font-weight:800;letter-spacing:4px}
.toast{position:absolute;z-index:30;left:50%;bottom:15%;transform:translateX(-50%);padding:9px 15px;border:1px solid rgba(90,225,255,.45);background:rgba(2,12,24,.94);font-size:8px;letter-spacing:2px;opacity:0;transition:.18s;white-space:nowrap}
.toast.show{opacity:1}
@media(min-width:700px){#app{height:100vh}}
</style>
</head>
<body>
<div id="app">
<div class="bg"></div><div class="moon"></div><div class="city"></div><div class="scan"></div>
<header class="top">
  <div><div class="brand">JUST EVADE</div><div class="sys">STAGE SELECT SYSTEM</div></div>
  <div class="area">AREA 01<small>NEON CITY</small></div>
</header>
<div class="divider"></div>
<main class="grid" id="grid"></main>
<footer class="bottom">
<button class="nav" id="prev">◀ AREA</button>
<div class="pages">01 — 10</div>
<button class="nav" id="next">AREA ▶</button>
</footer>
<section class="detail" id="detail">
<button class="close" id="close">CLOSE ×</button>
<div class="panel">
<div class="kicker">SELECTED STAGE</div>
<h1 id="dtitle">STAGE 01</h1>
<p id="dname">NEON RUN</p>
<div class="stats">
<div><span>BEST SCORE</span><b id="dscore">184520</b></div>
<div><span>RANK</span><b id="drank">S</b></div>
<div><span>COMBO</span><b id="dcombo">84</b></div>
</div>
<button class="start" id="start">START STAGE</button>
</div>
</section>
<div class="toast" id="toast">AREA 02 — COMING SOON</div>
</div>
<script>
const names=["NEON RUN","BLUE MOON","NIGHT GRID","CYBER VEIL","SKY LINE","RAPID EDGE","DARK FLOW","ZERO POINT","MOON RISE","LAST GATE"];
const ranks=["S","A","A","B","S","A","B","A","S","—"];
const scores=["184520","160340","148220","129870","176400","151220","112640","145900","190120","000000"];
const grid=document.getElementById("grid");
names.forEach((name,i)=>{
 const b=document.createElement("button"); b.className="card"+(i===0?" selected":""); b.type="button";
 b.innerHTML=`<div class="num">STAGE ${String(i+1).padStart(2,"0")}</div>
 <div class="rank">${ranks[i]}</div><div class="name">${name}</div>
 <div class="score">${scores[i]}</div><div class="progress"><i style="width:${ranks[i]==="—"?0:(55+i*4)}%"></i></div>`;
 b.onclick=()=>openStage(i); grid.appendChild(b);
});
function openStage(i){
 document.getElementById("dtitle").textContent=`STAGE ${String(i+1).padStart(2,"0")}`;
 document.getElementById("dname").textContent=names[i];
 document.getElementById("dscore").textContent=scores[i];
 document.getElementById("drank").textContent=ranks[i];
 document.getElementById("dcombo").textContent=ranks[i]==="—"?"—":String(42+i*7);
 document.getElementById("detail").style.display="flex";
}
document.getElementById("close").onclick=()=>document.getElementById("detail").style.display="none";
document.getElementById("start").onclick=()=>showToast("STAGE START — DEMO");
document.getElementById("prev").onclick=()=>showToast("AREA 10 ←");
document.getElementById("next").onclick=()=>showToast("AREA 02 — COMING SOON");
function showToast(t){const x=document.getElementById("toast");x.textContent=t;x.classList.add("show");setTimeout(()=>x.classList.remove("show"),1200)}
</script>
</body>
</html>
